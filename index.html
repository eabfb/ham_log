<style>

body{max-width:1400px;margin:20px auto;padding:0 16px;background:#f7f8fa;}

.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 1px 4px #0002;margin-bottom:20px;}
.form-grid{display:grid;grid-template-columns: 1fr 1fr 1fr;gap:12px;margin-bottom:20px;}
.form-item{display:flex;flex-direction:column;}
label{font-size:14px;margin-bottom:4px;color:#444;}

button{padding:9px 18px;border:none;border-radius:6px;cursor:pointer;font-size:15px;}

.btn-clear{background:#888;color:white;}
.btn-export{background:#279e68;color:white;}

.btn-del{background:#dd4444;color:white;padding:5px 8px;font-size:12px;}
.btn-edit{background:#4477dd;color:white;padding:5px 8px;font-size:12px;margin-right:4px;}
.search-bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;}

.pagination{margin:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

.modal-content{background:white;padding:20px;border-radius:10px;max-width:900px;width:90%;max-height:90vh;overflow:auto;}

<script>
const SUPABASE_URL = "https://isplkkksnsdiuolmyrxe.supabase.co";

//分页配置
const pageSize = 20;

// 标准化日期：斜杠转横杠，月日补0
function normalizeDateStr(dStr){
  if(!dStr) return '';
  let s = String(dStr).replace(/\//g,'-');
  const parts = s.split('-').map(x=>Number(x));
  if(parts.length===3){
    const [y,m,d] = parts;
    if(!isNaN(y)&&!isNaN(m)&&!isNaN(d)){
      return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }
  }
  return s;
}
// 标准化时间，小时补0
function normalizeTimeStr(tStr){
  if(!tStr) return '';
  const parts = String(tStr).split(':').map(x=>Number(x));
  if(parts.length>=2){
    const [h,mi] = parts;
    if(!isNaN(h)&&!isNaN(mi)){
      return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;
    }
  }
  return tStr;
}

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const els = {
  call_sign: document.getElementById('call_sign'),
  log_date: document.getElementById('log_date'),
  log_time: document.getElementById('log_time'),
  mode: document.getElementById('mode'),
  freq: document.getElementById('freq'),
  rst_sent: document.getElementById('rst_sent'),
  rst_rcv: document.getElementById('rst_rcv'),
  pwr_other: document.getElementById('pwr_other'),

  device_other: document.getElementById('device_other'),
  qsl_sent: document.getElementById('qsl_sent'),
  qsl_rcv: document.getElementById('qsl_rcv'),
  remark: document.getElementById('remark'),
};

window.doLogin = async function(){
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPwd').value;
  document.getElementById('loginError').innerText='';
  if(!email||!pw){
    document.getElementById('loginError').innerText="请填写邮箱与密码";
    return;
  }
  const {data,error}=await supabaseClient.auth.signInWithPassword({email:email,password:pw});
  if(error){
    document.getElementById('loginError').innerText=error.message;
    return;
  }
  document.getElementById('loginScreen').style.display="none";
  document.getElementById('mainApp').style.display="block";
  setDefaultDate();
  await fetchPageData();
  document.getElementById('syncStatus').innerText="✅云端连接正常";
};

window.doLogout = async function(){
  await supabaseClient.auth.signOut();
  document.getElementById('mainApp').style.display="none";
  document.getElementById('loginScreen').style.display="flex";
  editingOriginRecord=null;
};

function setDefaultDate(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  els.log_date.value = `${y}-${m}-${day}`;
}

//从云端拉取【当前页】数据（后端分页+数据库全局搜索）
async function fetchPageData(){
  if(!supabaseClient) return;
  const from = (currentPage -1)*pageSize;
  const to = from + pageSize -1;

  let q = supabaseClient.schema('public')
    .from('ham_logs')
    .select('*',{count:'exact'})
    .order('ts',{ascending:false})
    .range(from,to);

  if(searchKeyword.trim()!==''){
    const kw = searchKeyword.trim();
    q = q.or(`call_sign.ilike.%${kw}%,remark.ilike.%${kw}%,mode.ilike.%${kw}%,freq.ilike.%${kw}%`);
  }

  const {data,error,count} = await q;
  if(error){
    alert("读取云端失败："+error.message);
    console.error(error);
    document.getElementById('tableWrap').innerHTML="<p>读取错误</p>";
    document.getElementById('paginationWrap').innerHTML="";
    return;
  }
  totalCount = count;
  renderTable(data||[]);
  renderPagination();
}

function renderTable(list){
  const wrap = document.getElementById('tableWrap');
  if(list.length===0){
    wrap.innerHTML = `<p>暂无匹配记录</p>`;
    return;
  }
  let html = `<p>共 ${totalCount} 条记录</p><table><thead><tr><th>对方呼号</th><th>日期</th><th>时间</th><th>模式</th><th>频率</th><th>RST发出</th><th>RST接收</th><th>对端功率</th><th>本端功率</th><th>对端QTH</th><th>本端QTH</th><th>对端设备</th><th>QSL已发</th><th>QSL已收</th><th>备注</th><th>操作</th></tr></thead><tbody>`;
  list.forEach((r)=>{
    html+=`<tr>
<td>${escapeHtml(r.call_sign)}</td>
<td>${escapeHtml(r.log_date)}</td>
<td>${escapeHtml(r.log_time)}</td>
<td>${escapeHtml(r.mode)}</td>
<td>${escapeHtml(r.freq)}</td>
<td>${escapeHtml(r.rst_sent)}</td>
<td>${escapeHtml(r.rst_rcv)}</td>
<td>${escapeHtml(r.pwr_other)}</td>
<td>${escapeHtml(r.pwr_my)}</td>
<td>${escapeHtml(r.qth_other)}</td>
<td>${escapeHtml(r.qth_my)}</td>
<td>${escapeHtml(r.device_other)}</td>
<td>${escapeHtml(r.qsl_sent)}</td>
<td>${escapeHtml(r.qsl_rcv)}</td>
<td>${escapeHtml(r.remark)}</td>
<td><button class="btn-edit" onclick="openEdit(${r.ts})">修改</button><button class="btn-del" onclick="deleteRecord(${r.ts})">删除</button></td>
</tr>`;
  });
  html += `</tbody></table>`;
  wrap.innerHTML = html;
}

function renderPagination(){
  const totalPage = Math.ceil(totalCount / pageSize);
  let html = "";
  html += `<button onclick="goPage(${currentPage-1})" ${currentPage<=1?"disabled":""}>上一页</button>`;
  html += `<span>第 ${currentPage} / ${totalPage||1} 页</span>`;
  html += `<button onclick="goPage(${currentPage+1})" ${currentPage>=totalPage?"disabled":""}>下一页</button>`;
  document.getElementById("paginationWrap").innerHTML = html;
}

window.goPage = async function(p){
  const totalPage = Math.ceil(totalCount / pageSize);
  if(p<1 || p>totalPage) return;
  currentPage = p;
  await fetchPageData();
};

window.doSearch = async function(){
  searchKeyword = document.getElementById("searchCall").value.trim();
  currentPage = 1; //搜索重置回到第一页
  await fetchPageData();
};

window.saveRecord = async function(){
  const rec = {
    call_sign: els.call_sign.value.trim(),
    log_date: els.log_date.value,
    log_time: els.log_time.value,
    mode: els.mode.value.trim(),
    freq: els.freq.value.trim(),
    rst_sent: els.rst_sent.value.trim(),

    pwr_other: els.pwr_other.value.trim(),

    device_other: els.device_other.value.trim(),

  const updateObj = {

    log_time: document.getElementById('e_log_time').value.trim(),
    mode: document.getElementById('e_mode').value.trim(),
    freq: document.getElementById('e_freq').value.trim(),
    rst_sent: document.getElementById('e_rst_sent').value.trim(),

    pwr_other: document.getElementById('e_pwr_other').value.trim(),

  };

    return;
  }
  closeModal();
  await fetchPageData();

//导出CSV：导出全部数据，忽略分页
window.exportCsv = async function(){
  const {data,error} = await supabaseClient.schema('public').from('ham_logs').select('*').order('ts',{ascending:false});
  if(error||!data||data.length===0){alert('暂无日志记录');return;}
  const headers = ["对方呼号","日期","时间","模式","频率","RST发出","RST接收","对端功率","本端功率","对端QTH","本端QTH","对端设备","QSL已发","QSL已收","备注","时间戳"];
  function csvCell(s){s = String(s??'').replace(/"/g,'""');return `"${s}"`;}
  let lines = [headers.map(csvCell).join(',')];
  data.forEach(r=>{
    const row = [r.call_sign,r.log_date,r.log_time,r.mode,r.freq,r.rst_sent,r.rst_rcv,r.pwr_other,r.pwr_my,r.qth_other,r.qth_my,r.device_other,r.qsl_sent,r.qsl_rcv,r.remark,r.ts].map(csvCell);
    lines.push(row.join(','));
  });
  const csvText = lines.join('\n');
  const blob = new Blob(['\uFEFF' + csvText], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ham_log_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
};

window.handleImportCsv = async function(evt){
  const file = evt.target.files[0];if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    const text = e.target.result;
    const linesRaw = text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()!=='');
    const insertBatch = [];
    for(let lineIdx=1;lineIdx<linesRaw.length;lineIdx++){
      const line = linesRaw[lineIdx];
      const cells = [];let insideQuote = false;let buf = '';
      for(let i=0;i<line.length;i++){
        const c = line[i];
        if(c==='"'){if(insideQuote && line[i+1]==='"'){buf+='"';i++;}else{insideQuote=!insideQuote;}}
        else if(c===',' && !insideQuote){cells.push(buf);buf='';}else{buf+=c;}
      }
      cells.push(buf);
      insertBatch.push({
        call_sign:cells[0]||'',
        log_date:normalizeDateStr(cells[1]||''),
        log_time:normalizeTimeStr(cells[2]||''),
        mode:cells[3]||'',
        freq:cells[4]||'',
        rst_sent:cells[5]||'',
        rst_rcv:cells[6]||'',
        pwr_other:cells[7]||'',
        pwr_my:cells[8]||'',
        qth_other:cells[9]||'',
        qth_my:cells[10]||'',
        device_other:cells[11]||'',
        qsl_sent:cells[12]||'',
        qsl_rcv:cells[13]||'',
        remark:cells[14]||'',
        ts: Number(cells[15])||Date.now()+lineIdx
      });
    }
    if(insertBatch.length>0){
      const {error}=await supabaseClient.schema('public').from('ham_logs').insert(insertBatch);
      if(error){alert("CSV导入云端错误："+error.message);return;}
      alert(`CSV导入成功，共载入 ${insertBatch.length} 条记录到云端`);
      await fetchPageData();
    }
    evt.target.value='';
  };
  reader.readAsText(file);
};

//导出ADIF：导出全部数据，忽略分页
window.exportAdif = async function(){
  const {data,error} = await supabaseClient.schema('public').from('ham_logs').select('*').order('ts',{ascending:false});
  if(error||!data||data.length===0){alert('暂无日志记录');return;}
  let adif = "ADIF Export by HAM Log Supabase\n<ADIF_VER:5>3.1.4\n<PROGRAMID:14>BrowserSupabase\n<EOH>\n";
  for(const r of data){
    adif += `<QSO_DATE:8>${(r.log_date||'').replace(/-/g,'')}`;
    adif += `<TIME_ON:6>${(r.log_time||'').replace(/:/g,'')}`;
    adif += `<CALL:${(r.call_sign||'').length}>${r.call_sign||''}`;
    adif += `<MODE:${(r.mode||'').length}>${r.mode||''}`;
    adif += `<FREQ:${(r.freq||'').length}>${r.freq||''}`;
    adif += `<RST_SENT:${(r.rst_sent||'').length}>${r.rst_sent||''}`;
    adif += `<RST_RCVD:${(r.rst_rcv||'').length}>${r.rst_rcv||''}`;
    adif += `<QTH:${(r.qth_other||'').length}>${r.qth_other||''}`;
    adif += `<MY_QTH:${(r.qth_my||'').length}>${r.qth_my||''}`;
    adif += `<NOTES:${(r.remark||'').length}>${r.remark||''}`;
    adif += `<QSL_SENT:${(r.qsl_sent||'').length}>${r.qsl_sent||''}`;
    adif += `<QSL_RCVD:${(r.qsl_rcv||'').length}>${r.qsl_rcv||''}`;
    adif += `<COMMENT:${(r.device_other||'').length}>${r.device_other||''}`;
    adif += `<EOR>\n`;
  }
  const blob = new Blob([adif], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ham_log_${new Date().toISOString().slice(0,10)}.adi`;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
};

window.handleImportAdif = async function(evt){
  const file = evt.target.files[0];if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    let text = e.target.result;
    text = text.replace(/[\r\n]/g," ");
    const records = [];
    const eorSplit = text.split(/<EOR>/i);
    for(let recStr of eorSplit){
      recStr = recStr.trim();
      if(!recStr) continue;
      const qso = {
        call_sign:"",
        log_date:"",
        log_time:"",
        mode:"",
        freq:"",
        rst_sent:"",
        rst_rcv:"",
        qth_other:"",
        qth_my:"",
        remark:"",
        qsl_sent:"",
        qsl_rcv:"",
        device_other:"",
        pwr_other:"",
        pwr_my:"",
        ts:Date.now()+records.length
      };
      const fieldRe = /<([A‑Za‑z_]+):(\d+)(?::[^\>]+)?>([^<]+)/g;
      let m;
      while((m = fieldRe.exec(recStr))!==null){
        const tag = m[1].toUpperCase();
        const len = parseInt(m[2]);
        const val = m[3].substring(0,len).trim();
        switch(tag){
          case "CALL": qso.call_sign = val;break;
          case "QSO_DATE": qso.log_date = normalizeDateStr(val.replace(/(\d{4})(\d{2})(\d{2})/,"$1‑$2‑$3"));break;
          case "TIME_ON": qso.log_time = normalizeTimeStr(val.replace(/(\d{2})(\d{2})/,"$1:$2"));break;
          case "MODE": qso.mode = val;break;
          case "FREQ": qso.freq = val;break;
          case "RST_SENT": qso.rst_sent = val;break;
          case "RST_RCVD": qso.rst_rcv = val;break;
          case "QTH": qso.qth_other = val;break;
          case "MY_QTH": qso.qth_my = val;break;
          case "NOTES": qso.remark = val;break;
          case "QSL_SENT": qso.qsl_sent = val;break;
          case "QSL_RCVD": qso.qsl_rcv = val;break;
          case "COMMENT": qso.device_other = val;break;
        }
      }
      records.push(qso);
    }
    if(records.length>0){
      const {error}=await supabaseClient.schema('public').from('ham_logs').insert(records);
      if(error){alert("ADI导入云端失败:"+error.message);return;}
      alert(`ADIF导入成功，共载入 ${records.length} 条QSO到云端`);
      await fetchPageData();
    }
    evt.target.value='';
  };
  reader.readAsText(file);
};
